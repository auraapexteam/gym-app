workflows:
  aura-apex-ios-release:
    name: Aura Apex iOS Release IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: frontend-app
          include: true
    environment:
      groups:
        - aura_apex_ios_release
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      node: 22.11.0
      xcode: 26.4
      cocoapods: default
      vars:
        XCODE_WORKSPACE: SubscriptionManagement.xcworkspace
        XCODE_SCHEME: SubscriptionManagement
    scripts:
      - name: Validate required release configuration
        script: |
          set -eu
          : "${BUNDLE_ID:?Set BUNDLE_ID in the aura_apex_ios_release environment-variable group.}"
          : "${MARKETING_VERSION:?Set MARKETING_VERSION in the aura_apex_ios_release environment-variable group.}"
          : "${BUILD_NUMBER:?Set BUILD_NUMBER in the aura_apex_ios_release environment-variable group.}"
          case "$BUNDLE_ID" in *.*) ;; *) echo "BUNDLE_ID must be a reverse-DNS identifier." >&2; exit 1;; esac
          case "$BUNDLE_ID" in *[!A-Za-z0-9.-]*) echo "BUNDLE_ID contains unsupported characters." >&2; exit 1;; esac
          case "$MARKETING_VERSION" in *[!0-9.]*|.*|*.) echo "MARKETING_VERSION must use numeric dot-separated components." >&2; exit 1;; esac
          case "$BUILD_NUMBER" in *[!0-9]*|'') echo "BUILD_NUMBER must be a positive integer." >&2; exit 1;; esac
      - name: Install JavaScript dependencies
        script: |
          cd "$CM_BUILD_DIR/frontend"
          npm ci
      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/frontend/ios"
          pod install --repo-update
      - name: Apply release identity and version in the CI workspace
        script: |
          set -eu
          PROJECT="$CM_BUILD_DIR/frontend/ios/SubscriptionManagement.xcodeproj/project.pbxproj"
          perl -0pi -e 's|org\.reactjs\.native\.example\.\$\(PRODUCT_NAME:rfc1034identifier\)|$ENV{BUNDLE_ID}|g' "$PROJECT"
          cd "$CM_BUILD_DIR/frontend/ios"
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Configure App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/frontend"
          xcode-project use-profiles
      - name: Build signed Release IPA
        script: |
          cd "$CM_BUILD_DIR/frontend"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/frontend/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/build/ios/ipa/*.ipa
      - frontend/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

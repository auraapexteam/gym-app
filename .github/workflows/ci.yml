name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    name: Typecheck → Test → Build
    runs-on: ubuntu-latest

    env:
      # These are dummy values used only to satisfy env-schema validation at
      # startup in CI. The entire Supabase module is mocked during tests so
      # no real database is accessed.
      NODE_ENV: test
      PORT: 5000
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      RAZORPAY_KEY_ID: ci-placeholder-key-id
      RAZORPAY_KEY_SECRET: ci-placeholder-key-secret
      RAZORPAY_WEBHOOK_SECRET: ci-placeholder-webhook-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ── 1. Install ──────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 2. Typecheck ────────────────────────────────────────────────────────
      - name: TypeScript type check
        run: npm run typecheck

      # ── 3. Tests ─────────────────────────────────────────────────────────────
      - name: Run test suite
        run: npm test

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Production build
        run: npm run build

      # ── 5. Migration / Schema Validation ────────────────────────────────────
      # Validates that schema.sql is well-formed SQL by checking for common
      # issues. A full Supabase migration run is not feasible in CI without a
      # live project, so we do a structural sanity-check instead.
      - name: Validate schema.sql exists and is non-empty
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -f schema.sql ]; then
            echo "ERROR: schema.sql not found in repository root"
            exit 1
          fi
          LINES=$(wc -l < schema.sql)
          if [ "$LINES" -lt 10 ]; then
            echo "ERROR: schema.sql appears too short ($LINES lines) — possible corruption"
            exit 1
          fi
          echo "schema.sql OK ($LINES lines)"

      # ── 6. Compiled artifact smoke-test ─────────────────────────────────────
      # Verifies the compiled server can be imported without crashing.
      # Uses a 3-second timeout — enough for module resolution, not a real boot.
      - name: Smoke-test compiled artifact
        run: |
          timeout 3 node dist/server.js || EXIT=$?
          if [ "$EXIT" -eq 124 ]; then
            echo "Smoke test OK — server started but was killed by timeout (expected)"
          elif [ "$EXIT" -ne 0 ]; then
            echo "ERROR: server crashed on startup (exit code $EXIT)"
            exit 1
          fi
